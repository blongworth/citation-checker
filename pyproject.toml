[project]
name = "citation-checker"
version = "0.1.0"
description = "Check that citations actually exist"
readme = "README.md"
authors = [
    { name = "Brett Longworth", email = "blongworth@whoi.edu" }
]
requires-python = ">=3.10"
dependencies = [
    "bibtexparser>=2.1.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "rapidfuzz>=3.14.5",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
citation-checker = "citation_checker:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
